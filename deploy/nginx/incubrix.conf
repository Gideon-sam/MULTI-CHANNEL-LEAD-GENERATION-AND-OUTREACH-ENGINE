server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name incubrix-outreach-engine.eastasia.cloudapp.azure.com 20.205.139.234;

    root /var/www/incubrix;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /creators/data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /health.json {
        default_type application/json;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
