[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incubrix-growth-engine"
version = "1.0.0"
description = "Auditable, privacy-conscious creator lead qualification and outreach engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "certifi>=2025.1",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "langdetect>=1.0.9,<2",
  "openpyxl>=3.1,<4",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
incubrix-engine = "incubrix_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

